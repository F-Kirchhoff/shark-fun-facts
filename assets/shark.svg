  <!-- eye -->
  <circle cx="54" cy="82" r="8" fill="#ffffff" />
  <circle cx="56" cy="83" r="4" fill="#0e2b3f" />
  <circle cx="52" cy="79" r="1.6" fill="#ffffff" />

  <!-- bubbles -->
  <circle cx="13" cy="68" r="5" fill="#4fc9c0" opacity="0.55" />
  <circle cx="7" cy="50" r="3" fill="#4fc9c0" opacity="0.4" />
