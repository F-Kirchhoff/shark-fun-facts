  <path fill="#245d7d" d="M194 74 C214 60, 238 40, 250 30 C246 56, 240 78, 238 88 C240 100, 246 120, 250 140 C236 130, 212 110, 198 96 Z" />

  <!-- dorsal fin -->
  <path fill="#245d7d" d="M112 52 C118 34, 128 22, 136 18 C142 30, 148 42, 152 56 C140 52, 124 50, 112 52 Z" />

  <!-- body -->
  <path fill="#2f7396" d="M22 96 C34 64, 68 50, 108 50 C142 50, 174 58, 194 72 L198 96 C176 112, 140 124, 104 124 C64 124, 32 112, 22 96 Z" />

